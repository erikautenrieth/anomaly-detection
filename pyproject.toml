[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-anomaly-detection"
version = "0.1.0"
description = "Isolation Forest experiments on Merton jump-diffusion and financial market data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Erik Autenrieth" },
    { name = "Pierre Zimmermann" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "yfinance",
]

[project.optional-dependencies]
notebooks = ["jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
